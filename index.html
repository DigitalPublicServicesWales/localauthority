<div class="cards"><section class="card"><span class="card-icon" aria-hidden="true">▤</span><h3>Content pattern</h3><p>Explore the recommended page structure, shared wording and areas for local adaptation.</p><button type="button" data-page="preview">Explore the content pattern →</button></section><section class="card"><span class="card-icon" aria-hidden="true">◎</span><h3>User needs and evidence</h3><p>See which needs this content should meet and what still needs testing.</p><button type="button" data-page="needs">Explore user needs →</button></section><section class="card"><span class="card-icon" aria-hidden="true">✎</span><h3>Adapt for your local authority</h3><p>Enter local details and prepare a draft that you can review and download.</p><button type="button" data-page="setup">Adapt the pattern →</button></section><section class="card"><span class="card-icon" aria-hidden="true">↗</span><h3>Work with us</h3><p>Share feedback, explain local differences and help improve the shared pattern.</p><button type="button" data-page="work">Find out how to contribute →</button></section></div>

function work(){return `<div class="crumb">Home / Work with us</div><div class="measure"><h2>Work with us</h2><p class="lead">We are developing this content pattern with local authorities in Wales. Your experience can help make it more useful.</p><h3>Tell us what works and what needs to change</h3><p>We want to learn how the pattern fits your local arrangements, whether the adaptation questions are useful and what parents and carers need from these pages.</p><ul><li>Share examples of your existing childcare pages.</li><li>Tell us where your application process differs from the pattern.</li><li>Help us test the content and the adaptation tool.</li><li>Share research or feedback from families and frontline staff.</li></ul><div class="work-panel"><h3>Get in touch</h3><p>For now, you can contact Digital Public Services Wales through its published contact route. We can add a dedicated childcare project contact when the team agrees it.</p><div class="actions"><a class="btn" href="https://digitalpublicservices.gov.wales/about-us/get-in-touch" target="_blank" rel="noopener noreferrer">Contact Digital Public Services Wales →</a></div></div><h3>How we use feedback</h3><p>We will review what we learn with participating local authorities and use it to improve the shared pattern. We will not treat this prototype as approved policy guidance.</p><div class="actions"><button class="btn secondary" data-page="setup">Try adapting the pattern</button><button class="btn soft" data-page="needs">Read the user needs</button></div></div>`}
function needs(){return `<div class="crumb">Home / User needs</div><div class="measure"><h2>User needs for this content</h2><p class="lead">These working user needs describe what parents and carers should be able to understand and do from the funded childcare for 2-year-olds page. They are derived from the current content pattern, <strong>not yet validated research findings</strong>.</p><div class="note"><strong>Keep the page focused</strong><p>The page should help families understand the funded offer, check when it applies, find a participating provider, prepare to apply, apply and know what happens next. Link to supporting services rather than duplicating their information.</p></div>
<h3>Core user needs</h3><div class="needs-list"><section class="need"><h4>1. Understand what funded childcare is available</h4><div class="need-statement"><p><strong>As a…</strong> a parent or carer of a 2-year-old</p><p><strong>I need to…</strong> understand what funded childcare is available</p><p><strong>So that I can…</strong> I can decide whether it could help my family</p></div><p class="small muted">Related page content: What you can get — hours, term-time availability and possible additional costs.</p></section><section class="need"><h4>2. Know when my child can use it</h4><div class="need-statement"><p><strong>As a…</strong> a parent or carer</p><p><strong>I need to…</strong> know when my child can start and stop receiving funded childcare</p><p><strong>So that I can…</strong> I can plan childcare arrangements</p></div><p class="small muted">Related page content: When your child can get funded childcare.</p></section><section class="need"><h4>3. Find a suitable provider</h4><div class="need-statement"><p><strong>As a…</strong> a parent or carer</p><p><strong>I need to…</strong> find a childcare provider that offers the funded hours in my area</p><p><strong>So that I can…</strong> I can arrange a place for my child</p></div><p class="small muted">Related page content: Where you can use the funded hours; find a provider link; before-you-apply guidance.</p></section><section class="need"><h4>4. Prepare and apply</h4><div class="need-statement"><p><strong>As a…</strong> a parent or carer</p><p><strong>I need to…</strong> know how to apply and what information I need</p><p><strong>So that I can…</strong> I can submit an application without avoidable delays</p></div><p class="small muted">Related page content: Before you apply; documents to upload; application link.</p></section><section class="need"><h4>5. Know what happens after applying</h4><div class="need-statement"><p><strong>As a…</strong> a parent or carer</p><p><strong>I need to…</strong> know what happens after I apply and when my child can start</p><p><strong>So that I can…</strong> I know what to expect and what to do next</p></div><p class="small muted">Related page content: After you apply; confirmation and next steps. The wording depends on the application variant.</p></section><section class="need"><h4>6. Get help if I need it</h4><div class="need-statement"><p><strong>As a…</strong> a parent or carer</p><p><strong>I need to…</strong> know who to contact about applying or finding childcare</p><p><strong>So that I can…</strong> get help if I cannot complete the next step myself</p></div><p class="small muted">Related page content: Contact us — application support and Family Information Service.</p></section></div><h3>What this page should not try to do</h3><ul><li>Explain every type of childcare or every funding scheme available in Wales.</li><li>Replace a provider directory or an online application service.</li><li>Explain detailed provider administration processes intended for childcare businesses.</li><li>Make eligibility decisions on behalf of the local authority.</li></ul><p>These needs and boundaries are a starting hypothesis for testing with families and local authority teams. Some may need combining, splitting or changing as evidence emerges.</p><section class="resource-links" aria-labelledby="related-guidance"><h3 id="related-guidance">Related DPSW guidance</h3><p>These resources can help you design the wider application journey and review the content.</p><ul><li><a href="https://digitalpublicservices.gov.wales/service-pattern-library/apply-pattern" target="_blank" rel="noopener noreferrer">Apply service pattern</a> — guidance for entry, application steps and confirmation.</li><li><a href="https://digitalpublicservices.gov.wales/guidance-and-standards/service-manual" target="_blank" rel="noopener noreferrer">Service Manual for Wales</a> — guidance on designing and delivering user-centred services.</li><li><a href="https://digitalpublicservices.gov.wales/guidance-and-standards/service-manual/researching-your-users-and-testing-your-service/understanding-fundamental-user-needs" target="_blank" rel="noopener noreferrer">Understanding fundamental user needs</a> — needs that apply across public services, alongside the page-specific needs here.</li></ul></section><h3>Questions to validate</h3><ul><li>Can families tell whether this funded offer is relevant to them, or is information about eligibility missing?</li><li>Do families choose a childcare provider before or after applying in each local area, and how does that change their questions?</li><li>Are the documents and next steps accurate for each local authority?</li><li>Can families find suitable help, including Welsh-language and non-digital support?</li></ul><div class="actions"><button class="btn" data-page="setup">Adapt for your local authority</button><button class="btn secondary" data-page="preview">View the content pattern</button></div></div>`}
function field(key,label,opts={}){const val=esc(data[key]);const hint=opts.hint?`<p class="hint" id="hint-${key}">${opts.hint}</p>`:'';return `<div class="field ${opts.full?'full':''}"><label for="${key}">${label}</label>${hint}<input id="${key}" name="${key}" type="${opts.type||'text'}" value="${val}" placeholder="${esc(opts.placeholder||'')}" ${opts.hint?`aria-describedby="hint-${key}"`:''}></div>`}
function setup(){return `<div class="crumb">Home / Adapt for your local authority</div><div class="workflow"><aside class="sidebar"><strong>Your local version</strong><ol><li class="current">Provide local details</li><li>Preview and download</li></ol></aside><section><h2>Adapt for your local authority</h2><p class="lead">Enter the local details that need to appear in the page. Your changes are saved in this browser and shown in the preview.</p><div class="note">Only enter public service information, not details about individual families.</div>
<form id="setupForm"><h3>Local authority</h3><div class="form-grid"><div class="field"><label for="authority">Choose a local authority</label><select id="authority" name="authority"><option value="">Select a local authority</option>${authorities.map(a=>`<option ${data.authority===a?'selected':''} value="${esc(a)}">${esc(a)}</option>`).join('')}</select></div>${field('council','Full council name (header)',{placeholder:'For example, Cardiff Council'})}${field('area','Area name (page body)',{placeholder:'For example, Cardiff'})}</div>
<h3 class="section-head">Application support</h3><div class="form-grid">${field('team','Childcare funding team or service name',{placeholder:'Team or service name'})}${field('teamEmail','Application team email',{type:'email',placeholder:'name@example.gov.uk'})}${field('teamPhone','Application team phone',{type:'tel',placeholder:'Phone number'})}${field('fisEmail','Family Information Service email',{type:'email',placeholder:'name@example.gov.uk'})}${field('fisPhone','Family Information Service phone',{type:'tel',placeholder:'Phone number'})}</div>
<h3 class="section-head">Application process</h3><div class="field"><fieldset><legend>When is the childcare provider chosen?</legend><label class="radio"><input type="radio" name="providerTiming" value="before" ${data.providerTiming==='before'?'checked':''}> Provider chosen before applying</label><label class="radio"><input type="radio" name="providerTiming" value="after" ${data.providerTiming==='after'?'checked':''}> Provider chosen after applying</label><p class="hint">Only the first version has supplied draft wording in the material provided so far. The other version will show a placeholder until wording is agreed.</p></fieldset></div><div class="form-grid">${field('applicationUrl','Funded childcare application URL',{type:'url',placeholder:'https://example.gov.uk/apply'})}${field('providerUrl','Childcare provider search URL',{type:'url',placeholder:'https://www.childcareinformation.wales/'})}${field('processingDays','Processing time (working days)',{type:'number',placeholder:'For example, 10'})}${field('systemName','Name of online application system',{placeholder:'Optional – if used locally'})}${field('confirmationMethod','Confirmation method',{placeholder:'For example, email or another method',hint:'Use only a method confirmed by the authority.'})}</div><div class="actions"><button class="btn" type="button" data-page="preview">Preview your page</button><button class="btn secondary" type="button" id="reset">Clear saved answers</button></div><p id="setupStatus" role="status" class="status"></p></form></section></div>`}
function contact(email,phone){let out='';if(email)out+=`<p>Email: ${mail(email)?`<a href="mailto:${esc(email)}">${esc(email)}</a>`:esc(email)}</p>`;else out+=placeholder('Add email address');if(phone)out+=`<p>Telephone: ${esc(phone)}</p>`;else out+=placeholder('Add phone number');return out}
function pageMarkup(){const area=data.area.trim()||'[area]';const areaHtml=data.area.trim()?esc(area):'<span class="placeholder">[area]</span>';const team=data.team.trim()?esc(data.team):'<span class="placeholder">[childcare funding team or service name]</span>';const findLink=link(data.providerUrl,'Find a childcare provider');const applyLink=link(data.applicationUrl,'Apply for funded childcare');const timing=data.providerTiming==='before'?`<h4>After you apply</h4><p>${team} will process your application and confirm your child’s funded childcare place by ${esc(data.confirmationMethod.trim()||'[confirmation method]')}.</p><p>Your confirmation will tell you:</p><ul><li>when your child’s funded childcare starts</li><li>how many funded hours they will get</li><li>which childcare provider they will attend</li><li>what you need to do next</li></ul><p><strong>Your funded childcare cannot start until you receive confirmation.</strong></p>`:`<h4>After you apply</h4>${placeholder('Add agreed wording for the version where a provider is chosen after applying. This has not yet been supplied.')}`;
return `<h2>Funded childcare for 2-year-olds</h2><p>Find out about funded childcare for your 2-year-old and how to apply.</p><p>If you live in <strong>${areaHtml}</strong> and have a 2-year-old child, you can get Welsh Government funded childcare.</p><h3>What you can get</h3><p>You can get up to 12.5 hours of funded childcare a week during school term time.</p><p>This is usually:</p><ul><li>2.5 hours a day</li><li>up to 5 days a week</li><li>Monday to Friday</li><li>39 weeks of the year</li></ul><p>You can pay for extra childcare hours if you need them.</p><p>Your childcare provider will tell you if you need to:</p><ul><li>pay for food or snacks</li><li>provide food, snacks or drinks</li></ul><h3>When your child can get funded childcare</h3><p>You can get funded childcare from the school term after your child’s second birthday until the school term after their third birthday.</p><h3>Where you can use the funded hours</h3><p>You must use a childcare provider that offers Welsh Government funded childcare for 2-year-olds in <strong>${areaHtml}</strong>.</p><p>${findLink}</p><h3>Apply for funded childcare</h3><h4>Before you apply</h4>${data.providerTiming==='before'?'<p>Check that your childcare provider offers Welsh Government funded childcare for 2-year-olds and has a place for your child.</p><p>'+findLink+'</p>':placeholder('Confirm before-you-apply guidance for the version where the childcare provider is chosen after applying.')}<p>You will need to upload:</p><ul><li>your child’s birth certificate</li><li>a recent Council Tax or utility bill as proof of your address</li></ul><h4>Apply online</h4><p>When you have everything you need, you can apply online.</p><p><strong>${applyLink}</strong></p>${timing}<h3>Contact us</h3><h4>For help with your application</h4><p>Contact ${team}.</p>${contact(data.teamEmail,data.teamPhone)}<h4>For help finding childcare</h4><p>Contact ${areaHtml} Family Information Service.</p>${contact(data.fisEmail,data.fisPhone)}`}
function plain(){const area=data.area.trim()||'[area]',team=data.team.trim()||'[childcare funding team or service name]',get=s=>s.trim()||'[Add local detail]';return `WORKING DRAFT – CHECK BEFORE PUBLICATION\nCouncil: ${get(data.council)}\n\nFunded childcare for 2-year-olds\n\nFind out about funded childcare for your 2-year-old and how to apply.\n\nIf you live in ${area} and have a 2-year-old child, you can get Welsh Government funded childcare.\n\nWhat you can get\n\nYou can get up to 12.5 hours of funded childcare a week during school term time.\n\nThis is usually:\n- 2.5 hours a day\n- up to 5 days a week\n- Monday to Friday\n- 39 weeks of the year\n\nYou can pay for extra childcare hours if you need them.\n\nYour childcare provider will tell you if you need to:\n- pay for food or snacks\n- provide food, snacks or drinks\n\nWhen your child can get funded childcare\n\nYou can get funded childcare from the school term after your child’s second birthday until the school term after their third birthday.\n\nWhere you can use the funded hours\n\nYou must use a childcare provider that offers Welsh Government funded childcare for 2-year-olds in ${area}.\n\nFind a childcare provider: ${get(data.providerUrl)}\n\nApply for funded childcare\n\nBefore you apply\nCheck that your childcare provider offers Welsh Government funded childcare for 2-year-olds and has a place for your child.\n\nFind a childcare provider: ${get(data.providerUrl)}\n\nYou will need to upload:\n- your child’s birth certificate\n- a recent Council Tax or utility bill as proof of your address\n\nApply online\nWhen you have everything you need, you can apply online.\n\nApply for funded childcare: ${get(data.applicationUrl)}\n\nAfter you apply\n${data.providerTiming==='before'?`${team} will process your application and confirm your child’s funded childcare place by ${get(data.confirmationMethod)}.\n\nYour confirmation will tell you:\n- when your child’s funded childcare starts\n- how many funded hours they will get\n- which childcare provider they will attend\n- what you need to do next\n\nYour funded childcare cannot start until you receive confirmation.`:'[Add agreed wording for provider chosen after applying.]'}\n\nContact us\n\nFor help with your application\nContact ${team}.\nEmail: ${get(data.teamEmail)}\nTelephone: ${get(data.teamPhone)}\n\nFor help finding childcare\nContact ${area} Family Information Service.\nEmail: ${get(data.fisEmail)}\nTelephone: ${get(data.fisPhone)}\n\nREVIEW REQUIRED\nCheck national scheme wording, local details, application process, accessibility and Welsh-language content.\n`}
function review(){return `<div class="crumb">Home / Preview and download</div><div class="workflow"><aside class="sidebar"><strong>Your local version</strong><ol><li>Provide local details</li><li class="current">Preview and download</li></ol><button class="btn secondary" data-page="setup" type="button">Edit local details</button></aside><section><h2>Preview your page</h2><p class="lead">This is how the page could read using the shared pattern and your local information.</p><div class="warning"><strong>Working draft – not approved for publication.</strong><p>Check the scheme wording, application process, local links and contact details. Complete accessibility and Welsh-language reviews before publishing.</p></div><p class="small"><span class="badge">Missing details are highlighted</span></p><article class="preview" id="page-preview" aria-label="Childcare content draft">${pageMarkup()}</article><div class="no-print"><h3>Review before using</h3><div class="checklist"><label><input type="checkbox"> The policy wording and application process have been confirmed.</label><label><input type="checkbox"> The local details, links and contact information have been checked.</label><label><input type="checkbox"> The Welsh-language version and accessibility have been reviewed.</label></div><p class="small muted">This checklist is for the person reviewing the draft. It is not a publication approval process.</p><div class="actions"><button class="btn secondary" data-page="setup">Edit local details</button><button class="btn" type="button" id="download">Download text draft</button><button class="btn soft" type="button" id="copy">Copy draft</button><button class="btn soft" type="button" id="print">Print / save as PDF</button></div><p id="reviewStatus" role="status" class="status"></p><div class="note"><strong>Help improve this pattern</strong><p>Discuss unclear or missing content with your team and use the <button type="button" class="inline-nav" data-page="work">Work with us</button> section to find the current contact route. The toolkit is being developed with local authorities.</p></div></div></section></div>`}

function workCy(){return `<div class="crumb">Hafan / Gweithio gyda ni</div><div class="measure"><h2>Gweithio gyda ni</h2><p class="lead">Rydym yn datblygu’r patrwm cynnwys hwn gydag awdurdodau lleol yng Nghymru. Gall eich profiad helpu i’w wella.</p><h3>Dywedwch wrthym beth sy’n gweithio</h3><ul><li>Rhannwch enghreifftiau o’ch tudalennau gofal plant presennol.</li><li>Esboniwch sut mae eich proses gwneud cais yn wahanol.</li><li>Helpwch ni i brofi’r cynnwys a’r offeryn addasu.</li><li>Rhannwch ymchwil neu adborth gan deuluoedd a staff rheng flaen.</li></ul><div class="work-panel"><h3>Cysylltu â ni</h3><p>Am y tro, cysylltwch â Gwasanaethau Cyhoeddus Digidol Cymru drwy’r dudalen gyswllt swyddogol.</p><div class="actions"><a class="btn" href="https://digitalpublicservices.gov.wales/about-us/get-in-touch" target="_blank" rel="noopener noreferrer">Cysylltu â Gwasanaethau Cyhoeddus Digidol Cymru →</a></div></div><h3>Sut rydym yn defnyddio adborth</h3><p>Byddwn yn adolygu’r hyn a ddysgwn gydag awdurdodau lleol sy’n cymryd rhan. Nid canllawiau polisi cymeradwy yw’r prototeip hwn.</p><button class="btn secondary" data-page="setup">Rhoi cynnig ar y patrwm</button>${draftCyNotice}</div>`}

function needsCy(){return `<div class="crumb">Hafan / Anghenion defnyddwyr</div><div class="measure"><h2>Anghenion defnyddwyr</h2><p class="lead">Anghenion arfaethedig sy’n ymwneud yn benodol â’r cynnwys hwn. Rhaid eu gwirio yn erbyn ymchwil gyda theuluoedd.</p>${draftCyNotice}<h3>Anghenion craidd</h3><div class="needs-list">${needsCyData.map((n,i)=>`<section class="need"><h4>${i+1}. ${n[0]}</h4><div class="need-statement"><p><strong>Fel…</strong> ${n[1]}</p><p><strong>Mae angen i mi…</strong> ${n[2]}</p><p><strong>Er mwyn i mi allu…</strong> ${n[3]}</p></div><p class="small muted">Cynnwys cysylltiedig: ${n[4]}.</p></section>`).join('')}</div><h3>Beth na ddylai’r dudalen geisio ei wneud</h3><ul><li>Esbonio pob math o ofal plant a phob cynllun ariannu yng Nghymru.</li><li>Disodli cyfeiriadur darparwyr na gwasanaeth gwneud cais.</li><li>Cynnwys prosesau gweinyddol manwl ar gyfer busnesau gofal plant.</li><li>Gwneud penderfyniadau cymhwystra ar ran yr awdurdod lleol.</li></ul>${cyResourceLinks}<h3>Cwestiynau i’w profi</h3><ul><li>A all teuluoedd ddeall a yw’r cynnig yn berthnasol iddynt?</li><li>Pryd mae teuluoedd yn dewis darparwr yn yr ardal leol?</li><li>A yw’r dogfennau a’r camau nesaf yn gywir?</li><li>A oes cymorth Cymraeg a chymorth all-lein ar gael?</li></ul><button class="btn" data-page="setup">Addasu ar gyfer eich awdurdod lleol</button></div>`}
function setupCy(){return `<div class="crumb">Hafan / Addasu ar gyfer eich awdurdod lleol</div><div class="workflow"><aside class="sidebar"><strong>Eich fersiwn leol</strong><ol><li class="current">Rhoi manylion lleol</li><li>Rhagolwg a lawrlwytho</li></ol></aside><section><h2>Addasu ar gyfer eich awdurdod lleol</h2><p class="lead">Rhowch y manylion lleol sydd eu hangen ar y dudalen. Caiff eich atebion eu cadw yn y porwr hwn a’u dangos yn y rhagolwg.</p><div class="note">Rhowch wybodaeth gyhoeddus am wasanaethau yn unig, nid manylion teuluoedd unigol.</div>${draftCyNotice}<form id="setupForm"><h3>Awdurdod lleol</h3><div class="form-grid"><div class="field"><label for="authority">Dewiswch awdurdod lleol</label><select id="authority" name="authority"><option value="">Dewiswch awdurdod lleol</option>${authorities.map(a=>`<option ${data.authority===a?'selected':''} value="${esc(a)}">${esc(a)}</option>`).join('')}</select></div>${field('council','Enw llawn y cyngor (pennawd)',{placeholder:'Er enghraifft, Cyngor Caerdydd'})}${field('area','Enw’r ardal (testun y dudalen)',{placeholder:'Er enghraifft, Caerdydd'})}</div><h3 class="section-head">Cymorth gyda cheisiadau</h3><div class="form-grid">${field('team','Enw’r tîm ariannu gofal plant neu’r gwasanaeth',{placeholder:'Enw’r tîm neu’r gwasanaeth'})}${field('teamEmail','E-bost y tîm ceisiadau',{type:'email',placeholder:'enw@enghraifft.gov.uk'})}${field('teamPhone','Ffôn y tîm ceisiadau',{type:'tel',placeholder:'Rhif ffôn'})}${field('fisEmail','E-bost y Gwasanaeth Gwybodaeth i Deuluoedd',{type:'email'})}${field('fisPhone','Ffôn y Gwasanaeth Gwybodaeth i Deuluoedd',{type:'tel'})}</div><h3 class="section-head">Y broses gwneud cais</h3><div class="field"><fieldset><legend>Pryd mae’r teulu’n dewis darparwr gofal plant?</legend><label class="radio"><input type="radio" name="providerTiming" value="before" ${data.providerTiming==='before'?'checked':''}> Cyn gwneud cais</label><label class="radio"><input type="radio" name="providerTiming" value="after" ${data.providerTiming==='after'?'checked':''}> Ar ôl gwneud cais</label><p class="hint">Dim ond ar gyfer yr opsiwn cyntaf y mae geiriad drafft wedi’i ddarparu. Bydd yr ail yn dangos bwlch tan y cytunir ar y testun.</p></fieldset></div><div class="form-grid">${field('applicationUrl','Dolen gwneud cais am ofal plant wedi’i ariannu',{type:'url'})}${field('providerUrl','Dolen chwilio am ddarparwr gofal plant',{type:'url'})}${field('processingDays','Amser prosesu (diwrnodau gwaith)',{type:'number',placeholder:'Er enghraifft, 10'})}${field('systemName','Enw’r system gwneud cais ar-lein',{placeholder:'Dewisol'})}${field('confirmationMethod','Sut y caiff y cais ei gadarnhau',{placeholder:'Er enghraifft, drwy e-bost',hint:'Defnyddiwch ddull sydd wedi’i gadarnhau gan yr awdurdod.'})}</div><div class="actions"><button class="btn" type="button" data-page="preview">Gweld rhagolwg y dudalen</button><button class="btn secondary" type="button" id="reset">Clirio’r atebion</button></div><p id="setupStatus" role="status" class="status"></p></form></section></div>`}
function contactCy(email,phone){let out='';if(email)out+=`<p>E-bost: ${mail(email)?`<a href="mailto:${esc(email)}">${esc(email)}</a>`:esc(email)}</p>`;else out+=placeholder('Ychwanegwch gyfeiriad e-bost');if(phone)out+=`<p>Ffôn: ${esc(phone)}</p>`;else out+=placeholder('Ychwanegwch rif ffôn');return out}
function pageMarkupCy(){const area=data.area.trim()?esc(data.area):'<span class="placeholder">[ardal]</span>',team=data.team.trim()?esc(data.team):'<span class="placeholder">[enw’r tîm neu’r gwasanaeth]</span>';const provider=link(data.providerUrl,'Dod o hyd i ddarparwr gofal plant'),apply=link(data.applicationUrl,'Gwneud cais am ofal plant wedi’i ariannu');const timing=data.providerTiming==='before'?`<p>Bydd ${team} yn prosesu eich cais ac yn cadarnhau lle gofal plant eich plentyn drwy ${esc(data.confirmationMethod.trim()||'[dull cadarnhau]')}.</p><p>Bydd eich cadarnhad yn dweud wrthych:</p><ul><li>pryd mae gofal plant wedi’i ariannu eich plentyn yn dechrau</li><li>faint o oriau wedi’u hariannu y bydd eich plentyn yn eu cael</li><li>pa ddarparwr gofal plant y bydd eich plentyn yn mynd ato</li><li>beth sydd angen i chi ei wneud nesaf</li></ul><p><strong>Ni all y gofal plant wedi’i ariannu ddechrau nes i chi gael cadarnhad.</strong></p>`:placeholder('Nid yw’r testun ar gyfer dewis darparwr ar ôl gwneud cais wedi’i gytuno eto.');return `<h2>Gofal plant wedi’i ariannu ar gyfer plant 2 oed</h2><p>Gwybodaeth am ofal plant wedi’i ariannu ar gyfer eich plentyn 2 oed a sut i wneud cais.</p><p>Os ydych yn byw yn <strong>${area}</strong> ac mae gennych blentyn 2 oed, gallwch gael gofal plant wedi’i ariannu gan Lywodraeth Cymru.</p><h3>Beth y gallwch ei gael</h3><p>Gallwch gael hyd at 12.5 awr o ofal plant wedi’i ariannu bob wythnos yn ystod tymor yr ysgol.</p><p>Fel arfer, mae hyn yn golygu:</p><ul><li>2.5 awr y dydd</li><li>hyd at 5 diwrnod yr wythnos</li><li>o ddydd Llun i ddydd Gwener</li><li>39 wythnos y flwyddyn</li></ul><p>Gallwch dalu am oriau ychwanegol o ofal plant os oes eu hangen arnoch.</p><p>Bydd eich darparwr gofal plant yn dweud wrthych a oes angen i chi:</p><ul><li>dalu am fwyd neu fyrbrydau</li><li>darparu bwyd, byrbrydau neu ddiodydd</li></ul><h3>Pryd y gall eich plentyn gael gofal plant wedi’i ariannu</h3><p>Gallwch gael gofal plant wedi’i ariannu o’r tymor ysgol ar ôl ail ben-blwydd eich plentyn tan y tymor ysgol ar ôl ei drydydd pen-blwydd.</p><h3>Ble y gallwch ddefnyddio’r oriau wedi’u hariannu</h3><p>Rhaid defnyddio darparwr gofal plant sy’n cynnig gofal plant wedi’i ariannu gan Lywodraeth Cymru ar gyfer plant 2 oed yn <strong>${area}</strong>.</p><p>${provider}</p><h3>Gwneud cais am ofal plant wedi’i ariannu</h3><h4>Cyn gwneud cais</h4>${data.providerTiming==='before'?`<p>Gwiriwch fod eich darparwr gofal plant yn cynnig gofal plant wedi’i ariannu gan Lywodraeth Cymru ar gyfer plant 2 oed a bod lle ar gael i’ch plentyn.</p><p>${provider}</p>`:placeholder('Cadarnhewch y canllawiau cyn gwneud cais os dewisir darparwr ar ôl cyflwyno’r cais.')}<p>Bydd angen i chi uwchlwytho:</p><ul><li>tystysgrif geni eich plentyn</li><li>bil Treth y Cyngor neu fil cyfleustodau diweddar fel prawf o’ch cyfeiriad</li></ul><h4>Gwneud cais ar-lein</h4><p>Pan fydd gennych bopeth sydd ei angen, gallwch wneud cais ar-lein.</p><p><strong>${apply}</strong></p><h4>Ar ôl gwneud cais</h4>${timing}<h3>Cysylltu â ni</h3><h4>Am help gyda’ch cais</h4><p>Cysylltwch â ${team}.</p>${contactCy(data.teamEmail,data.teamPhone)}<h4>Am help i ddod o hyd i ofal plant</h4><p>Cysylltwch â Gwasanaeth Gwybodaeth i Deuluoedd ${area}.</p>${contactCy(data.fisEmail,data.fisPhone)}`}
function plainCy(){const doc=document.createElement('div');doc.innerHTML=pageMarkupCy().replace(/<\/(h2|h3|h4|p|li|ul)>/gi,'\n</$1>');return 'DRAFFT CYMRAEG – ANGEN EI ADOLYGU A’I GYMERADWYO CYN EI GYHOEDDI\n\n'+doc.textContent.replace(/\n{3,}/g,'\n\n')+'\n\nGWIRIWCH: geiriad polisi, trefniadau lleol, dolenni, hygyrchedd a’r cyfieithiad Cymraeg.\n'}
function reviewCy(){return `<div class="crumb">Hafan / Rhagolwg a lawrlwytho</div><div class="workflow"><aside class="sidebar"><strong>Eich fersiwn leol</strong><ol><li>Rhoi manylion lleol</li><li class="current">Rhagolwg a lawrlwytho</li></ol><button class="btn secondary" data-page="setup">Golygu’r manylion lleol</button></aside><section><h2>Rhagolwg o’ch tudalen</h2><p class="lead">Dyma sut y gallai’r dudalen edrych gan ddefnyddio’r patrwm cyffredin a’ch gwybodaeth leol.</p>${draftCyNotice}<div class="warning"><strong>Drafft gwaith – heb ei gymeradwyo i’w gyhoeddi.</strong><p>Gwiriwch y geiriad polisi, y broses gwneud cais, y dolenni a’r manylion cyswllt lleol. Rhaid adolygu’r Gymraeg a hygyrchedd cyn cyhoeddi.</p></div><p class="small"><span class="badge">Mae’r wybodaeth sydd ar goll wedi’i hamlygu</span></p><article class="preview" id="page-preview" aria-label="Drafft cynnwys gofal plant">${pageMarkupCy()}</article><div class="no-print"><h3>Gwiriwch cyn defnyddio</h3><div class="checklist"><label><input type="checkbox"> Mae’r geiriad polisi a’r broses gwneud cais wedi’u cadarnhau.</label><label><input type="checkbox"> Mae’r manylion, dolenni a chysylltiadau lleol wedi’u gwirio.</label><label><input type="checkbox"> Mae’r Gymraeg a hygyrchedd wedi’u hadolygu.</label></div><p class="small muted">Nid proses gymeradwyo swyddogol yw’r rhestr wirio hon.</p><div class="actions"><button class="btn secondary" data-page="setup">Golygu manylion lleol</button><button class="btn" id="download">Lawrlwytho’r drafft</button><button class="btn soft" id="copy">Copïo’r drafft</button><button class="btn soft" id="print">Argraffu / cadw fel PDF</button></div><p id="reviewStatus" role="status" class="status"></p><div class="note"><strong>Helpwch i wella’r patrwm</strong><p>Rhannwch gwestiynau neu wybodaeth sydd ar goll drwy’r adran <button class="inline-nav" data-page="work">Gweithio gyda ni</button>.</p></div></div></section></div>`}
